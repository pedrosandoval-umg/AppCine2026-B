<h2>Géneros</h2>

<form (ngSubmit)="guardarGenero()">

  <label>Nombre:</label>

  <input
    type="text"
    name="nombre"
    [(ngModel)]="genero.nombre"
    required
  >

  <button type="submit">
    Guardar
  </button>

  <button
    type="button"
    (click)="limpiar()"
  >
    Limpiar
  </button>

</form>

<hr>

<table border="1">

  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody>

    <tr *ngFor="let item of generos">

      <td>
        {{ item.idGenero }}
      </td>

      <td>
        {{ item.nombre }}
      </td>

      <td>

        <button
          type="button"
          (click)="eliminarGenero(item.idGenero)"
        >
          Eliminar
        </button>

      </td>

    </tr>

  </tbody>

</table>
